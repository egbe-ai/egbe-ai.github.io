<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFFFFF">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Page Not Found</title>
    <meta name="robots" content="noindex">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K4NHZYTGG6"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-K4NHZYTGG6');
    </script>
    <script>
        (function () {
            var prefix = "/p/";
            var path = window.location.pathname;

            if (!path.startsWith(prefix)) {
                return;
            }

            var promo = path.slice(prefix.length).replace(/^\/+|\/+$/g, "");
            if (!promo) {
                return;
            }

            var promoValue = promo;
            try {
                promoValue = decodeURIComponent(promo);
            } catch (error) {
                promoValue = promo;
            }

            var target = new URL("https://dashboard.egbe.ai/");
            var params = new URLSearchParams(window.location.search);
            params.set("promo", promoValue);
            target.search = params.toString();
            target.hash = window.location.hash;
            window.location.replace(target.toString());
        }());
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Same system as the landing (/index.html). */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            background: #FFFFFF;
            color: #1B1C2E;
            font: 1.0625rem/1.6 'Figtree', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        header { height: 56px; display: flex; align-items: center; padding: 0 16px; }

        .wordmark { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.035em; line-height: 1; color: #1B1C2E; text-decoration: none; }
        .wordmark span { color: #5266EB; }

        main {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 3rem 1.5rem;
            border-radius: 28px;
            background: #F3F4F9;
            text-align: center;
        }

        main > div { max-width: 34rem; }

        h1 {
            margin-bottom: 1rem;
            font-size: clamp(2.25rem, 5vw, 3.25rem);
            font-weight: 500;
            line-height: 1.06;
            letter-spacing: -0.028em;
        }

        p { margin-bottom: 1.75rem; color: #54566B; text-wrap: pretty; }

        code { font: 0.9375em ui-monospace, 'SF Mono', Menlo, monospace; color: #1B1C2E; background: #E3E5EE; border-radius: 6px; padding: 0.1em 0.4em; }

        .btn { display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 24px; border-radius: 99px; background: #5266EB; color: #fff; font-weight: 500; text-decoration: none; transition: background-color 0.15s; }
        .btn:hover { background: #4153D4; }

        :focus-visible { outline: 2px solid #5266EB; outline-offset: 3px; border-radius: 6px; }
    </style>
</head>
<body>
    <header>
        <a href="/" class="wordmark" aria-label="Egbe — home">Egbe<span>.</span></a>
    </header>
    <main>
        <div>
            <h1>Page not found</h1>
            <p>If you expected a promo redirect here, check that the link includes a code after <code>/p/</code>.</p>
            <a href="/" class="btn">Return to egbe.ai</a>
        </div>
    </main>
</body>
</html>
